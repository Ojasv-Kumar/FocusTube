<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FocusTube · Preferences</title><link rel="stylesheet" href="../design-tokens.css"><link rel="stylesheet" href="options.css"></head><body>
<main class="page"><header><p class="eyebrow">FOCUSTUBE / PREFERENCES</p><h1>Shape your viewing space.</h1><p>Preferences apply to YouTube tabs as you change them.</p></header>
<form id="settings-form"><section class="section"><h2>Modes</h2><label class="check"><input id="ask-every-tab" type="checkbox"> Ask me what I’m here for in every new tab</label><label>Default Interest topic<input id="interest" maxlength="120" placeholder="Embedded systems and robotics"></label><label>Results per search<select id="results-count"><option>5</option><option>8</option><option>10</option><option>15</option></select></label><label>Curiosity filtering<select id="strictness"><option value="relaxed">Relaxed</option><option value="balanced">Balanced</option><option value="strict">Strict</option></select></label></section>
<section class="section"><h2>Focus</h2><label class="check"><input id="shorts" type="checkbox"> Hide Shorts in Learn mode</label><label class="check"><input id="autoplay" type="checkbox"> Disable autoplay in Learn mode</label><label class="check"><input id="reasons" type="checkbox"> Show why each video was selected</label><label class="check"><input id="comments" type="checkbox"> Keep comments visible in Learn mode</label><label>Layout density<select id="density"><option value="comfortable">Comfortable</option><option value="compact">Compact</option></select></label></section>
<details class="section"><summary>Demo and diagnostics</summary><label class="check"><input id="mock" type="checkbox"> Use offline demo fixtures</label><label class="check"><input id="debug" type="checkbox"> Enable debug logging</label><div class="actions"><button id="health" type="button">Check current YouTube selectors</button><button id="clear-cache" type="button">Clear cache</button></div></details><p id="status" role="status" aria-live="polite">Loading preferences…</p><div class="actions sticky"><button class="primary" type="submit">Save preferences</button><button id="reset" type="button">Reset to defaults</button></div></form></main><script type="module" src="options.js"></script></body></html>
