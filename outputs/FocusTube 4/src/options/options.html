<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FocusTube · Settings</title><link rel="stylesheet" href="../design-tokens.css"><link rel="stylesheet" href="options.css"></head><body>
<main class="page"><header><p class="eyebrow">FOCUSTUBE / SETTINGS</p><h1>Shape your learning space.</h1><p>These preferences apply to YouTube tabs as they change.</p></header>
<form id="settings-form"><section class="section"><h2>Learn mode</h2><label class="check"><input id="hide-comments" type="checkbox"> Hide comments</label><label class="check"><input id="hide-subscriptions" type="checkbox"> Hide Subscriptions navigation</label></section>
<section class="section"><h2>Appearance</h2><label for="theme">FocusTube color theme<select id="theme"><option value="dark">Dark</option><option value="light">Light</option></select></label></section>
